name: Build macOS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'master'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install Xcode Command Line Tools
        run: |
          sudo xcode-select --install || echo "CLT already installed"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Homebrew dependencies
        run: |
          brew install cmake pkg-config

      - name: Verify nativefiledialog-extended
        run: |
          if [ ! -d "dependencies/nativefiledialog-extended" ]; then
            echo "Error: nativefiledialog-extended not found in dependencies/"
            echo "Please download it from https://github.com/btzy/nativefiledialog-extended/releases"
            echo "And place it in dependencies/nativefiledialog-extended/"
            exit 1
          fi

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          cmake --build build --config Release -j $(sysctl -n hw.ncpu)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Build
          path: build/src/Sprforge
          if-no-files-found: warn
